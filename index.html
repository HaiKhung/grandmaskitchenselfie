<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grandma's Kitchen Photo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="photo-container" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <img src="assets/images/vn-hat.png" class="overlay hat" alt="" />
    <img src="assets/images/logo.png" class="overlay logo" alt="Grandma's Kitchen logo" />
    <img src="assets/images/banh-khot.png" class="overlay pho" alt="" />
    <div class="slogan" id="slogan">Grandma's Kitchen – Vietnamese Traditional Food</div>

    <img id="result" class="result" alt="Your photo" hidden />
    <div id="countdown" class="countdown" aria-live="assertive" hidden></div>
    <div id="flash" class="flash"></div>
    <p id="message" class="message" role="status" hidden></p>
  </div>

  <div class="controls">
    <button id="capture" type="button" disabled>📸 Take Photo</button>
    <button id="retake" type="button" class="secondary" hidden>🔄 Retake</button>
    <a id="downloadLink" class="button" download="grandmas-photo.png" hidden>📥 Download</a>
    <button id="share" type="button" class="secondary" hidden>📤 Share</button>
  </div>

  <canvas id="canvas" hidden></canvas>

  <script src="script.js"></script>
</body>
</html>
